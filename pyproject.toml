[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ann-search-from-scratch"
version = "0.1.0"
description = "Vector search from scratch: k-means, IVF-Flat, IVF-PQ with ADC lookup tables, OPQ and HNSW with the neighbour-selection heuristic, benchmarked against FAISS and hnswlib on SIFT."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
bench = ["h5py>=3.9", "faiss-cpu>=1.8", "hnswlib>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E731"]
